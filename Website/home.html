    <style>
       /* Remove default margins and padding */
       body, html
            {
                margin: 0;
                padding: 0;
                overflow-x: hidden; /* Prevent horizontal scrolling */
            }

            header 
            {
                background-color: white;
                padding: 10px 20px; /* Space inside the header */
                position: fixed; /* Sticks to the top of the page */
                top: 0;
                left: 0;
                right: 0;
                z-index: 1000; /* Ensures the header is on top of other elements */
            }

            .header-nav 
            {
                font-family: 'aboxfor', sans-serif;
                display: flex;
                justify-content: space-between; /* Spreads links evenly */
                align-items: center; /* Vertically centers the content */
                margin: 0; /* Removes any extra spacing */
            }

         .header-nav a 
            {
                color: black;
                text-decoration: none;
                font-size: 30px;
                margin: 0 10px;
                padding: 10px 15px; /* Adds space inside the clickable area */
                display: inline-block;
            }

            body 
            {
                padding-top: 50px; /* Ensures content below the header is not hidden */
                background-color: black;
            }


            #site-title
            {
                font-size: 40px;
                font-family: 'Retrorama', sans-serif;
            }

            @font-face
             {
                font-family: 'Retrorama';
                src:  url('retroma_vibes/RetromaVibes.ttf');
                font-size: 40px;
                font-weight: normal;
                font-style: normal;
            }

            @font-face {
                font-family: 'aboxfor';
                src: url('a_box_for/A_Box_For.ttf');

            }
        .album-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
        }
        .album {
            width: 150px;
            height: 150px;
            margin-right: 10px;
            flex: none;
        }
        .marquee, .marquee-reverse 
        {
            display: flex;
            margin-top: -30px;
        }

        .marquee-reverse 
        {
            position: absolute;
            top: 400px;
            animation: marquee-reverse 80s linear infinite;
        }

        .marquee 
        {
            position: absolute;
            top: 200px;
            display: flex;
            animation: marquee 80s linear infinite;
        }

        #lyrics
        {
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
            text-align: center;
            margin-top: 70px;
            font-size: 15px;
            color: white;
        }

        footer
        {
            color: white;
            font-family: 'Times New Roman', Times, serif;
            text-align: center;
            font-size: 10px;
            margin-top: 500px;
            
        }

  

        
        @keyframes marquee 
        {
            100% { transform: translateX(0); }
            0% { transform: translateX(-50%); }
        }

        @keyframes marquee-reverse 
        {
            100% { transform: translateX(-50%); }
            0% { transform: translateX(0); }
        }

        @font-face
        {
            font-family: 'Retrorama';
            src:  url('retroma_vibes/RetromaVibes.ttf');
        }


    </style>
