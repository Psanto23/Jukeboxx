    #site-title a 
    {
        text-decoration: none;   /* Remove underline */
        color: inherit;          /* Inherit the h1 color */
        font-size: inherit;      /* Inherit the h1 font size */
        font-weight: inherit;    /* Inherit the h1 font weight */
    }

/* Style for the navigation links */

            border-radius: 10px;
            font-family: 'Times New Roman', Times, serif
        }

       
        
        footer
        {
            color: rgb(255, 254, 254);
            position: absolute;
            background-color: rgb(0, 0, 0);
            top: 600px;
            right: 10px;
            width: 100%;
            text-align: center;
            padding: 9px;
        }
        body 
        {
            background-color: black;
            margin: 0;
            overflow: hidden;
        }
        .album-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
        }
        .album {
            width: 150px;
            height: 150px;
            margin-right: 10px;
            flex: none;
        }
        .marquee, .marquee-reverse 
        {
            display: flex;
        }

        .marquee-reverse 
        {
            position: absolute;
            top: 400px;
            animation: marquee-reverse 80s linear infinite;
        }

        .marquee 
        {
            position: absolute;
            top: 200px;
            display: flex;
            animation: marquee 80s linear infinite;
        }

        
        @keyframes marquee 
        {
            100% { transform: translateX(0); }
            0% { transform: translateX(-50%); }
        }

        @keyframes marquee-reverse 
        {
            100% { transform: translateX(-50%); }
            0% { transform: translateX(0); }
        }


    </style>
