<!DOCTYPE html>
<html lang="en">
    <title>Rank</title>
    <head>
        <style>
/* Remove default margins and padding */
            body, html 
            {
                margin: 0;
                padding: 0;
            }

            header 
            {
                background-color: black;
                color: white;
                padding: 10px 20px; /* Space inside the header */
                position: fixed; /* Sticks to the top of the page */
                top: 0;
                left: 0;
                right: 0;
                z-index: 1000; /* Ensures the header is on top of other elements */
            }

            .header-nav 
            {
                font-family: 'aboxfor', sans-serif;
                display: flex;
                justify-content: space-between; /* Spreads links evenly */
                align-items: center; /* Vertically centers the content */
                margin: 0; /* Removes any extra spacing */
            }

         .header-nav a 
            {
                color: white;
                text-decoration: none;
                font-size: 30px;
                margin: 0 10px;
                padding: 10px 15px; /* Adds space inside the clickable area */
                display: inline-block;
            }

            body 
            {
                padding-top: 50px; /* Ensures content below the header is not hidden */
            }

                        /* Pop-Up Styles */
                        .popup-overlay {
                display: none; /* Hidden by default */
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent black */
                z-index: 999; /* Ensures it's above other content */
            }

            /*text on popup*/
            .popup-content {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background-color: rgb(0, 0, 0);
                font-family: 'Time', Times, serif;
                margin-right: 10px;
                color: white;
                padding: 20px;
                width: 300px;
            }

            /* dropdown menu */
            .popup-content input,
            .popup-content select {
                width: 200px;
                margin: 5px;
            }

            .popup-content button {
                padding: 15px;
                font-family: 'Times New Roman', Times, serif;
                background-color: black;
                color: white;
                border: none;
                border-radius: 0px;
                cursor: pointer;
                width: 100%;
                font-size: 20px;
            }

            .popup-content button:hover {
                background-color: black;
                font-family: 'aboxfor', sans-serif;
                color: white;
                font-size: 40px;

                
            }
            #rank-header
            {
                position: inherit;
                margin-bottom: 10px;
                margin-top: 10px;
                text-align: center;
                font-size: 100px;
                font-family: 'aboxfor', sans-serif;
                color: white;
            }
            #site-title
            {
                font-size: 40px;
                font-family: 'Retrorama', sans-serif;
            }

        .form-row 
        {
            display: flex; /* Aligns items in a row */
            flex-direction: row; /* Row layout */
            align-items: center; /* Vertically aligns label and input */
        }

        /* Style for labels */
        label 
        {
            display: flex;
            flex-direction: row;
            margin: 5px;
        }

        /* Style for input fields */
        input, select 
        {
            width: 200px; /* Set width of input boxes */
            padding: 5px; /* Internal spacing */
            font-size: 14px; /* Adjust text size */
        }

        #num-spots
        {
            width: 50px;
        }



  

            @font-face
             {
                font-family: 'Retrorama';
                src:  url('retroma_vibes/RetromaVibes.ttf');
                font-size: 40px;
                font-weight: normal;
                font-style: normal;
            }

            @font-face {
                font-family: 'aboxfor';
                src: url('a_box_for/A_Box_For.ttf');

            }
            
        </style>
    <header>
        <nav class="header-nav">
          <a href="rank.html">Rank</a>
          <a href="/review.html">Review</a>
          <a id='site-title' href="home.html" >Jukeboxx</a>
          <a href="/feed.html">Feed</a>
          <a href="/profile.html">Profile</a>
        </nav>
      </header>
      

    </head>

     <!-- Pop-Up Overlay -->
     <div class="popup-overlay" id="popup-overlay">
        <div class="popup-content">
        
            <form id="ranking-form">
                <h1 id="rank-header">Rank</h1>
                <label for="name">Name:</label>
                <input type="text" id="name" placeholder="Enter the name of your list" required>

                <label for="num-spots">Spots:</label>
                <input type="number" id="num-spots" min="1" max="200" placeholder="#" required>

                <label for="theme">Theme:</label>
                <select id="theme">
                    <option value="artist">Artists</option>
                    <option value="album">Albums</option>
                    <option value="song">Songs</option>
                </select>

                <button type="submit">Start</button>
            </form>
        </div>
    </div>

    <script>
        // Show the pop-up when the page loads
        window.onload = function() {
            document.getElementById("popup-overlay").style.display = "block";
        }

        // Close the pop-up when the form is submitted
        document.getElementById("ranking-form").onsubmit = function(event) {
            event.preventDefault(); // Prevent form from submitting normally
            const name = document.getElementById("name").value;
            const numSpots = document.getElementById("num-spots").value;
            const theme = document.getElementById("theme").value;


            // Close the pop-up
            document.getElementById("popup-overlay").style.display = "none";
        }
    </script>
</body>
</html>
