<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="icon" type="image/png" href="images/favicon.ico">

</head>
<style>
    /* Remove default margins and padding */
    body, html {
        margin: 0;
        padding: 0;
    }

    header {
        background-color: black;
        color: white;
        padding: 10px 20px; /* Space inside the header */
        position: fixed; /* Sticks to the top of the page */
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000; /* Ensures the header is on top of other elements */
    }

    .header-nav {
        font-family: 'aboxfor', sans-serif;
        display: flex;
        justify-content: space-between; /* Spreads links evenly */
        align-items: center; /* Vertically centers the content */
        margin: 0; /* Removes any extra spacing */
    }

    .header-nav a {
        color: white;
        text-decoration: none;
        font-size: 30px;
        margin: 0 10px;
        padding: 10px 15px; /* Adds space inside the clickable area */
        display: inline-block;
    }

    body
    {
        overflow: hidden;
        padding-top: 50px; /* Ensures content below the header is not hidden */
    }

    #site-title
    {
        font-size: 40px;
        font-family: 'Retrorama', sans-serif;
    }

    @font-face {
        font-family: 'Retrorama';
        src: url('retroma_vibes/RetromaVibes.ttf');
        font-size: 40px;
        font-weight: normal;
        font-style: normal;
    }

    @font-face {
        font-family: 'aboxfor';
        src: url('a_box_for/A_Box_For.ttf');
    }

    .container {
        width: 100%;
        height: 100vh; /* Full screen height */
        position: relative; /* To position the form relative to the background */
    }

    .background-image {
        width: 100%;        /* Stretch to the full width of the container */
        height: 100vh;      /* Stretch to the full height of the viewport */
        object-fit: cover;  /* Crop the image if it overflows */
        position: absolute; /* Make the image the bottom layer */
        top: 0;
        left: 0;
        z-index: 1; /* Background layer */
    }

    .registration-form {
        position: absolute; /* Position it over the background */
        z-index: 2;         /* Higher than the background */
        background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent background */
        padding: 20px;
        border-radius: 10px; /* Rounded corners */
        width: 300px; /* Width of the form */
        top: 30%; /* Center vertically */
        left: 50%; /* Center horizontally */
        transform: translate(-50%, -50%); /* Adjust for perfect centering */
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2); /* Optional shadow for depth */
        text-align: center;
    }

    #Register
    {
        color: white;
    }

    .registration-form input {
        display: block;
        width: 90%;
        padding: 10px;
        margin: 10px auto;
        border: 1px solid #ccc;
    }

    .registration-form button {
        padding: 10px;
        width: 90%;
        background-color: rgba(255, 255, 255, 0.952); /* Semi-transparent background */
        font-family: 'Times New Roman', Times, serif;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 20px;
    }

   


    footer
    {
        background-color: black;
        font-family: 'Times New Roman', Times, serif;
        text-align: center;
        font-size: 10px;
        padding: 10px;
        color: white;
            
    }
</style>
<body>
    <div id="header-container"></div>
    <div class="container">
        <img src="Images/registerphoto.jpg" alt="Background" class="background-image">

        <form class="registration-form">
            <h2 id="Register">Welcome to Jukeboxx!</h2>
            <input type="text" placeholder="Username">
            <input type="email" placeholder="Email">
            <input type="password" placeholder="Password">
            <button type="submit">Sign Up</button>
        </form>
    </div>
</body>

<script>
     // Fetch the header
     fetch("header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header-container").innerHTML = data;
            });
</script>
<footer>
    <h6>2024 Jukeboxx LLC</h6>
</footer>
</html>
