<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<style>
    /* Remove default margins and padding */
    body, html 
            {
                margin: 0;
                padding: 0;
            }

            header 
            {
                background-color: black;
                color: white;
                padding: 10px 20px; /* Space inside the header */
                position: fixed; /* Sticks to the top of the page */
                top: 0;
                left: 0;
                right: 0;
                z-index: 1000; /* Ensures the header is on top of other elements */
            }

            .header-nav 
            {
                font-family: 'aboxfor', sans-serif;
                display: flex;
                justify-content: space-between; /* Spreads links evenly */
                align-items: center; /* Vertically centers the content */
                margin: 0; /* Removes any extra spacing */
            }

         .header-nav a 
            {
                color: white;
                text-decoration: none;
                font-size: 30px;
                margin: 0 10px;
                padding: 10px 15px; /* Adds space inside the clickable area */
                display: inline-block;
            }

            body 
            {
                padding-top: 50px; /* Ensures content below the header is not hidden */
            }

                        /* Pop-Up Styles */
                        .popup-overlay {
                display: none; /* Hidden by default */
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent black */
                z-index: 999; /* Ensures it's above other content */
            }

            #site-title
            {
                font-size: 40px;
                font-family: 'Retrorama', sans-serif;
            }

            @font-face
             {
                font-family: 'Retrorama';
                src:  url('retroma_vibes/RetromaVibes.ttf');

</style>
    <header>
        <nav class="header-nav">

          <a href="feed.html">Feed</a>
          <a href="profile.html">Profile</a>
        </nav>
      </header>
    
    <main>
        <h2>Create a New Account</h2>
        <form action="register.php" method="POST">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <button type="submit">Register</button>
            </div>
        </form>
    </main>
</body>
